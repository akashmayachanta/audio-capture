[package]
name = "meetrec"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
audioadapter-buffers = "5"
audiopus_sys = { version = "0.2.2", features = ["static"] }
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
global-hotkey = "0.9"
ogg = "0.9"
rfd = "0.17"
ringbuf = "0.5"
rubato = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-winrt-notification = "0.8"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26"
uuid = { version = "1.28.0", features = ["v4"] }
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Power", "Win32_Media_Audio", "Win32_System_Registry", "Win32_System_Console"] }
winreg = "0.56"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
