# AudCap transcriber settings. Restart the server after editing.

# Folder with the recordings (YYYY/MM/*.opus). Empty = output_dir from
# AudCap's config.toml (%APPDATA%\AudCap\config.toml, or AUDCAP_CONFIG).
recordings_dir = ""

# Model loaded at startup when none was loaded before. After that the app
# loads the model you loaded last (Settings in the page; kept in transcriber.db
# in the cache folder). Options:
#   "whistle" - Cactus Whistle (en/de/fr/es/it/nl/pl, small and fast, ~17 MB)
#   "bark"    - Underdog Bark 3.0 (English, most accurate, ~160 MB download)
model = "whistle"

# Where Bark runs:
#   "auto" - Intel graphics (through OpenVINO) when there is one, else the CPU
#   "cpu"  - PyTorch on the CPU
#   "gpu"  - Intel graphics, and an error instead of the CPU if that fails
#   "cuda" - an NVIDIA GPU; needs a CUDA build of torch
device = "auto"

# Whistle language: "auto" (detect per piece; short noisy pieces can come out as another language) or one of en, de, fr, es, it, nl, pl.
language = "en"

# Whistle transcribes this many pieces at once, each in its own process (about
# 2 cores and 100 MB each). 0 = auto: a third of the CPU's logical cores, at most 4.
workers = 0

# Downloaded models. Empty = %LOCALAPPDATA%\AudCap\transcriber.
cache_dir = ""

host = "127.0.0.1"
port = 8765
