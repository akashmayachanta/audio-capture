[project]
name = "meetrec-transcriber"
version = "0.1.0"
description = "Local web UI that transcribes MeetRec recordings with Underdog Bark 3.0"
requires-python = "==3.11.*"
dependencies = [
    # Versions pinned to the ones the model card was evaluated with.
    "torch==2.8.0",
    "transformers==5.19.0",
    "constriction==0.5.0",
    "numpy==2.4.6",
    "librosa==0.11.0",
    "huggingface_hub==2.2.0",
    "av>=15",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "cactus-needle==3.2.8",
    "openvino==2026.4.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
